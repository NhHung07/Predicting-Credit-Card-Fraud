# ==========================================
# Cấu hình Thí nghiệm: Baseline LightGBM
# ==========================================

experiment:
  exp_id: "lgbm_a_v1"
  member: "A"
  description: "LightGBM baseline với 24 đặc trưng gốc"
  seed: 42

cv:
  n_folds: 5
  stratified: true
  folds_file: "data/processed/folds.csv"

features:
  # Cột nhãn và định danh
  target: "is_fraud"
  id_col: "id"
  # Danh sách cột categorical cần encode hoặc chỉ định cho LightGBM
  categorical_features:
    - "merchant_category"
    - "card_type"
    - "auth_method"
    - "channel"
    - "device_type"
  # Các cột bỏ qua không đưa vào huấn luyện
  drop_features:
    - "id"
    - "is_fraud"

# Siêu tham số (Hyperparameters) của LightGBM
model_params:
  objective: "binary"
  metric: "auc"
  boosting_type: "gbdt"
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8
  n_estimators: 2000
  random_state: 42
  n_jobs: -1
  verbose: -1

train_params:
  early_stopping_rounds: 50
  verbose_eval: 100
